# Application Configuration
spring.application.name=management-admission-wf
# Database Configuration - MySQL
spring.datasource.url=${ADMISSION_DB_URL:jdbc:mysql://localhost:3306/admission_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jmx.enabled=false
# SQL Initialization
spring.sql.init.mode=always
# Logging Configuration
logging.level.com.example.managementadmissionwf=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
