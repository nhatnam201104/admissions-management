# Server Configuration
server.port=5173
server.servlet.session.persistent=false

# Application Name
spring.application.name=thymeleaf_web

# Database Configuration
spring.datasource.url=${ADMISSION_DB_URL:jdbc:mysql://localhost:3306/admission_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Web registration writes candidate aspirations to xt_nguyenvongxettuyen.
spring.datasource.hikari.readOnly=false
spring.jpa.properties.hibernate.connection.readOnly=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Logging
logging.level.com.example.thymeleaf_web=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
