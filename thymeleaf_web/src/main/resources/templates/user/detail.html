<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(~{::title})}">
    <title>User Details - Thymeleaf Web</title>
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- User Detail Card -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">User Details</h2>
                        <span class="badge" 
                              th:classappend="${user.active} ? 'bg-success' : 'bg-danger'"
                              th:text="${user.active} ? 'Active' : 'Inactive'">
                            Active
                        </span>
                    </div>
                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-3">ID:</dt>
                            <dd class="col-sm-9" th:text="${user.id}">1</dd>
                            
                            <dt class="col-sm-3">Username:</dt>
                            <dd class="col-sm-9" th:text="${user.username}">username</dd>
                            
                            <dt class="col-sm-3">Email:</dt>
                            <dd class="col-sm-9">
                                <a th:href="'mailto:' + ${user.email}" 
                                   th:text="${user.email}">email@example.com</a>
                            </dd>
                            
                            <dt class="col-sm-3">Full Name:</dt>
                            <dd class="col-sm-9" th:text="${user.fullName} ?: '-'">John Doe</dd>
                            
                            <dt class="col-sm-3">Role:</dt>
                            <dd class="col-sm-9">
                                <span class="badge bg-secondary" th:text="${user.role}">USER</span>
                            </dd>
                            
                            <dt class="col-sm-3">Status:</dt>
                            <dd class="col-sm-9">
                                <span class="badge" 
                                      th:classappend="${user.active} ? 'bg-success' : 'bg-danger'"
                                      th:text="${user.active} ? 'Active' : 'Inactive'">
                                    Active
                                </span>
                            </dd>
                            
                            <dt class="col-sm-3">Created:</dt>
                            <dd class="col-sm-9" th:text="${user.createdAt}">2024-01-01 12:00</dd>
                            
                            <dt class="col-sm-3">Last Updated:</dt>
                            <dd class="col-sm-9" th:text="${user.updatedAt} ?: '-'">2024-01-01 12:00</dd>
                        </dl>
                    </div>
                    <div class="card-footer">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/users}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to List
                            </a>
                            <div class="btn-group">
                                <a th:href="@{/users/{id}/edit(id=${user.id})}" 
                                   class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <form th:action="@{/users/{id}/toggle(id=${user.id})}" 
                                      method="post" style="display: inline;">
                                    <button type="submit" 
                                            class="btn btn-secondary"
                                            th:text="${user.active} ? 'Deactivate' : 'Activate'">
                                        <i class="bi bi-power"></i> 
                                    </button>
                                </form>
                                <form th:action="@{/users/{id}/delete(id=${user.id})}" 
                                      method="post" 
                                      onsubmit="return confirm('Are you sure you want to delete this user?')"
                                      style="display: inline;">
                                    <button type="submit" class="btn btn-danger">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
