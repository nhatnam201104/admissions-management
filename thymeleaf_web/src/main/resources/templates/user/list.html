<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(~{::title})}">
    <title>Users List - Thymeleaf Web</title>
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    
    <main class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>User Management</h1>
            <a th:href="@{/users/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Add New User
            </a>
        </div>
        
        <!-- Alert Message -->
        <div th:if="${message}" class="alert alert-dismissible fade show" 
             th:classappend="'alert-' + (${messageType} ?: 'info')"
             role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Users Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Full Name</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${users.empty}">
                                <td colspan="8" class="text-center text-muted">
                                    No users found. Create your first user!
                                </td>
                            </tr>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.username}">username</td>
                                <td th:text="${user.email}">email@example.com</td>
                                <td th:text="${user.fullName} ?: '-'">John Doe</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${user.role}">USER</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${user.active} ? 'bg-success' : 'bg-danger'"
                                          th:text="${user.active} ? 'Active' : 'Inactive'">
                                        Active
                                    </span>
                                </td>
                                <td th:text="${user.createdAt}">2024-01-01</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/users/{id}(id=${user.id})}" 
                                           class="btn btn-sm btn-info" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/users/{id}/edit(id=${user.id})}" 
                                           class="btn btn-sm btn-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/users/{id}/toggle(id=${user.id})}" 
                                              method="post" style="display: inline;">
                                            <button type="submit" 
                                                    class="btn btn-sm btn-secondary"
                                                    th:title="${user.active} ? 'Deactivate' : 'Activate'">
                                                <i class="bi bi-power"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/users/{id}/delete(id=${user.id})}" 
                                              method="post" 
                                              onsubmit="return confirm('Are you sure you want to delete this user?')"
                                              style="display: inline;">
                                            <button type="submit" 
                                                    class="btn btn-sm btn-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Back to Home -->
        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </div>
    </main>
    
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
