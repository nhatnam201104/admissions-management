<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(~{::title})}">
    <title th:text="${userId != null} ? 'Edit User' : 'Create User'">Create User</title>
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h2 th:text="${userId != null} ? 'Edit User' : 'Create New User'">Create New User</h2>
                    </div>
                    <div class="card-body">
                        <!-- Alert Message -->
                        <div th:if="${message}" class="alert alert-dismissible fade show" 
                             th:classappend="'alert-' + (${messageType} ?: 'info')"
                             role="alert">
                            <span th:text="${message}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- User Form -->
                        <form th:action="${userId != null} ? @{/users/{id}(id=${userId})} : @{/users}"
                              th:object="${user}" 
                              method="post"
                              class="needs-validation" novalidate>
                            
                            <!-- Username Field -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Username *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                       placeholder="Enter username"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" 
                                     th:errors="*{username}"></div>
                                <small class="form-text text-muted">Username must be between 3 and 50 characters.</small>
                            </div>
                            
                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                       placeholder="Enter email"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" 
                                     th:errors="*{email}"></div>
                            </div>
                            
                            <!-- Full Name Field -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="fullName" 
                                       th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                       placeholder="Enter full name">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" 
                                     th:errors="*{fullName}"></div>
                            </div>
                            
                            <!-- Role Field -->
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" 
                                        id="role" 
                                        th:field="*{role}"
                                        th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                                    <option value="USER">USER</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="MODERATOR">MODERATOR</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" 
                                     th:errors="*{role}"></div>
                            </div>
                            
                            <!-- Password Field (only for new users or if editing and password is changed) -->
                            <div class="mb-3" th:if="${userId == null}">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Enter password"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" 
                                     th:errors="*{password}"></div>
                                <small class="form-text text-muted">Password must be at least 6 characters.</small>
                            </div>
                            
                            <!-- Password Field (optional when editing) -->
                            <div class="mb-3" th:if="${userId != null}">
                                <label for="password" class="form-label">Password (leave blank to keep current)</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Enter new password">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" 
                                     th:errors="*{password}"></div>
                                <small class="form-text text-muted">Leave blank to keep current password.</small>
                            </div>
                            
                            <!-- Form Actions -->
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/users}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> <span th:text="${userId != null} ? 'Update' : 'Create'">Create</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{layout/footer :: footer}"></div>
    
    <script>
        // Form validation
        (function() {
            'use strict';
            
            var forms = document.querySelectorAll('.needs-validation');
            
            Array.prototype.slice.call(forms)
                .forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        
                        form.classList.add('was-validated');
                    }, false);
                });
        })();
    </script>
</body>
</html>
