<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head(~{::title})}">
    <title>Tra Cứu Điểm - Xét Tuyển</title>
  </head>
  <body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="lookup-page d-flex flex-column my-3" style="min-height: 70vh">
      <div class="container flex-grow-1">
        <div class="lookup-card">
          <div class="lookup-header">
            <div class="lookup-icon">
              <i class="bi bi-search-heart"></i>
            </div>
            <h1>Tra Cứu Điểm Xét Tuyển</h1>
            <p class="text-muted">
              Nhập số CCCD và ngày sinh để xem kết quả xét tuyển
            </p>
          </div>

          <form
            th:action="@{/tra-cuu-diem}"
            th:object="${cccdForm}"
            method="post"
            id="lookupForm"
            novalidate
          >
            <div class="mb-3">
              <label for="cccd" class="form-label fw-semibold">Số CCCD</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                <input
                  type="text"
                  th:field="*{cccd}"
                  th:class="'form-control' + (*{#fields.hasErrors('cccd')} ? ' is-invalid' : '')"
                  id="cccd"
                  maxlength="12"
                  placeholder="Nhập 12 số CCCD"
                  inputmode="numeric"
                  autocomplete="off"
                />
              </div>
              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('cccd')}"
                th:errors="*{cccd}"
              ></div>
            </div>

            <div class="mb-3">
              <label for="ngaySinh" class="form-label fw-semibold">Ngày sinh</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-calendar-date"></i></span>
                <input
                  type="date"
                  th:field="*{ngaySinh}"
                  th:class="'form-control' + (*{#fields.hasErrors('ngaySinh')} ? ' is-invalid' : '')"
                  id="ngaySinh"
                  autocomplete="bday"
                />
              </div>
              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('ngaySinh')}"
                th:errors="*{ngaySinh}"
              ></div>
            </div>

            <div
              th:if="${errorMessage}"
              class="alert alert-warning d-flex align-items-center"
              role="alert"
            >
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span th:text="${errorMessage}"></span>
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 mt-3"
              id="btn-search"
            >
              <span class="btn-text">Tra cứu điểm</span>
              <span
                class="spinner-border spinner-border-sm d-none"
                id="btn-spinner"
                role="status"
              ></span>
            </button>
            <a
              th:href="@{/dang-ky-nguyen-vong}"
              class="btn btn-outline-primary btn-lg w-100 mt-3"
            >
              <i class="bi bi-ui-checks-grid me-2"></i>Đăng ký nguyện vọng
            </a>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/score-lookup.js}"></script>
  </body>
</html>
