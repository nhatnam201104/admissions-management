<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(~{::title})}">
    <title>500 - Internal Server Error</title>
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="error-page">
                    <h1 class="display-1 text-danger">500</h1>
                    <h2 class="mb-4">Internal Server Error</h2>
                    <p class="lead text-muted" th:text="${error} ?: 'An unexpected error occurred. Please try again later.'">
                        An unexpected error occurred. Please try again later.
                    </p>
                    <p class="text-muted small">
                        Error Code: <span th:text="${errorCode} ?: 'INTERNAL_ERROR'">INTERNAL_ERROR</span>
                    </p>
                    <a th:href="@{/}" class="btn btn-primary mt-3">
                        <i class="bi bi-house"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
