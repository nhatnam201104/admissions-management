<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head(~{::title})}">
    <title>Điểm Chuẩn - Xét Tuyển</title>
  </head>
  <body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="major-scores-page d-flex flex-column my-3" style="min-height: 70vh;">
      <div class="container flex-grow-1">
        <div class="result-card">
          <div
            class="result-card-header d-flex justify-content-between align-items-center flex-wrap gap-2"
          >
            <h5 class="mb-0">
              <i class="bi bi-bar-chart-steps me-2"></i>Điểm sàn và điểm chuẩn
            </h5>
            <div class="d-flex gap-2 d-print-none">
              <a
                th:href="@{/tra-cuu-diem}"
                class="btn btn-outline-secondary btn-sm"
              >
                <i class="bi bi-search me-1"></i>Tra cứu điểm
              </a>
              <a
                th:href="@{/dang-ky-nguyen-vong}"
                class="btn btn-outline-primary btn-sm"
              >
                <i class="bi bi-ui-checks-grid me-1"></i>Đăng ký nguyện vọng
              </a>
              <button
                class="btn btn-outline-primary btn-sm"
                onclick="window.print()"
              >
                <i class="bi bi-printer me-1"></i>In
              </button>
            </div>
          </div>
          <div class="result-card-body">
            <div class="row mb-3 d-print-none">
              <div class="col-md-4">
                <div class="input-group input-group-sm">
                  <span class="input-group-text"
                    ><i class="bi bi-funnel"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control"
                    id="filterInput"
                    placeholder="Tìm theo mã/tên ngành..."
                    autocomplete="off"
                  />
                </div>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover mb-0 major-table" id="majorTable">
                <thead>
                  <tr>
                    <th style="width: 50px" class="text-center">STT</th>
                    <th style="width: 120px">Mã ngành</th>
                    <th>Tên ngành</th>
                    <th style="width: 110px" class="text-center">Điểm sàn</th>
                    <th style="width: 130px" class="text-center">Điểm chuẩn</th>
                    <th style="width: 90px" class="text-center">Chỉ tiêu</th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    th:each="ng, iter : ${nganhs}"
                    class="major-row"
                    th:attr="data-search=${#strings.toLowerCase(ng.manganh) + ' ' + #strings.toLowerCase(ng.tennganh)}"
                  >
                    <td
                      class="text-center text-muted"
                      th:text="${iter.count}"
                    ></td>
                    <td><code th:text="${ng.manganh}"></code></td>
                    <td th:text="${ng.tennganh}"></td>
                    <td class="text-center">
                      <span
                        th:if="${ng.nDiemsan != null}"
                        class="fw-semibold"
                        th:text="${ng.nDiemsan}"
                      ></span>
                      <span
                        th:unless="${ng.nDiemsan != null}"
                        class="text-muted"
                        >-</span
                      >
                    </td>
                    <td class="text-center">
                      <span
                        th:if="${ng.nDiemtrungtuyen != null}"
                        class="badge bg-success fs-6"
                        th:text="${ng.nDiemtrungtuyen}"
                      ></span>
                      <span
                        th:unless="${ng.nDiemtrungtuyen != null}"
                        class="badge bg-light text-dark border"
                        >Chưa công bố</span
                      >
                    </td>
                    <td class="text-center">
                      <span
                        th:if="${ng.nChitieu != null}"
                        th:text="${ng.nChitieu}"
                      ></span>
                      <span
                        th:unless="${ng.nChitieu != null}"
                        class="text-muted"
                        >-</span
                      >
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(nganhs)}">
                    <td colspan="6" class="text-center text-muted py-4">
                      Chưa có dữ liệu ngành
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div id="noResults" class="text-center text-muted py-4 d-none">
              Không tìm thấy ngành phù hợp.
            </div>

            <!-- ===== Pagination ===== -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3 d-print-none"
                 id="paginationBar">
              <div class="d-flex align-items-center gap-2 small text-muted">
                <span>Hiển thị</span>
                <select class="form-select form-select-sm" id="pageSizeSelect" style="width:auto">
                  <option value="20">20</option>
                  <option value="50" selected>50</option>
                  <option value="100">100</option>
                  <option value="200">200</option>
                </select>
                <span>ngành / trang</span>
                <span id="pageRangeInfo" class="ms-2"></span>
              </div>
              <div class="d-flex align-items-center gap-1">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnFirst" title="Trang đầu">«</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnPrev" title="Trang trước">‹</button>
                <span class="px-2 small" id="pageInfo">Trang 1/1</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnNext" title="Trang sau">›</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLast" title="Trang cuối">»</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script>
      (function() {
        const filterInput = document.getElementById('filterInput');
        const noResults = document.getElementById('noResults');
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        const btnFirst = document.getElementById('btnFirst');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnLast = document.getElementById('btnLast');
        const pageInfo = document.getElementById('pageInfo');
        const pageRangeInfo = document.getElementById('pageRangeInfo');
        const paginationBar = document.getElementById('paginationBar');
        const allRows = Array.from(document.querySelectorAll('.major-row'));

        let currentPage = 1;
        let pageSize = parseInt(pageSizeSelect.value, 10) || 50;
        let filteredRows = allRows.slice();

        function applyFilter() {
          const keyword = (filterInput.value || '').toLowerCase().trim();
          if (!keyword) {
            filteredRows = allRows.slice();
          } else {
            filteredRows = allRows.filter(row =>
              (row.getAttribute('data-search') || '').includes(keyword));
          }
          currentPage = 1;
          render();
        }

        function totalPages() {
          return Math.max(1, Math.ceil(filteredRows.length / pageSize));
        }

        function render() {
          // Ẩn tất cả
          allRows.forEach(r => r.style.display = 'none');
          const totalPg = totalPages();
          if (currentPage > totalPg) currentPage = totalPg;
          const start = (currentPage - 1) * pageSize;
          const end = Math.min(start + pageSize, filteredRows.length);
          for (let i = start; i < end; i++) {
            filteredRows[i].style.display = '';
          }
          // Renumber STT theo thứ tự visible (giữ index gốc của data, nhưng
          // user thường mong số STT chạy liền). Ở đây ta giữ STT gốc.
          noResults.classList.toggle('d-none', filteredRows.length > 0);
          paginationBar.classList.toggle('d-none', filteredRows.length === 0);
          pageInfo.textContent = 'Trang ' + currentPage + '/' + totalPg;
          if (filteredRows.length > 0) {
            pageRangeInfo.textContent = '(' + (start + 1) + '–' + end + ' / ' + filteredRows.length + ' ngành)';
          } else {
            pageRangeInfo.textContent = '';
          }
          btnFirst.disabled = currentPage <= 1;
          btnPrev.disabled = currentPage <= 1;
          btnNext.disabled = currentPage >= totalPg;
          btnLast.disabled = currentPage >= totalPg;
        }

        filterInput.addEventListener('input', applyFilter);
        pageSizeSelect.addEventListener('change', () => {
          pageSize = parseInt(pageSizeSelect.value, 10) || 50;
          currentPage = 1;
          render();
        });
        btnFirst.addEventListener('click', () => { currentPage = 1; render(); });
        btnPrev.addEventListener('click', () => { if (currentPage > 1) { currentPage--; render(); } });
        btnNext.addEventListener('click', () => { if (currentPage < totalPages()) { currentPage++; render(); } });
        btnLast.addEventListener('click', () => { currentPage = totalPages(); render(); });

        render();
      })();
    </script>
  </body>
</html>
